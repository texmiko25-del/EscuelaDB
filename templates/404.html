<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/Logo_Escuela.ico' %}">
    <style>
        html,body{height:100%;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;overflow:hidden;background:#ffffff}
        .full-viewport{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
        .outer-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
        .inner-card{background:#ffffff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.08);width:min(760px,90%);padding:48px;text-align:center;max-height:90vh;overflow:hidden}
        .badge{display:inline-block;padding:8px 12px;border-radius:999px;background:#eef2ff;color:#4338ca;font-weight:700;margin-bottom:16px}
        h1{font-size:28px;margin:0 0 10px}
        p{color:#6b7280;margin-bottom:24px;line-height:1.6}
        .btn{display:inline-block;text-decoration:none;background:#2563eb;color:white;padding:12px 18px;border-radius:10px;font-weight:600}
        .logo{height:140px;margin-top:18px;display:block;margin-left:auto;margin-right:auto}
        @media (max-width:640px){.inner-card{padding:28px;width:94%;height:auto}.logo{height:100px}}
    </style>
</head>
<body>
    <div class="full-viewport">
        <div class="outer-container">
            <div class="inner-card" role="alert">
                <div class="badge">Error 404</div>
                <h1>Página no encontrada</h1>
                <p>La sección que intentas abrir no existe o ya no está disponible en este sitio.</p>
                <div style="margin-bottom:20px;">
                    <a href="javascript:history.back()" class="btn">Volver</a>
                </div>
                <img src="{% static 'img/Logo_Escuela.png' %}" alt="Logo Escuela" class="logo"/>
            </div>
        </div>
    </div>
</body>
</html>
